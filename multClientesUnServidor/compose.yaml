services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-clientes-servidor:latest
    container_name: multi-clientes-servidor

    # El servidor escucha en 4444; se mapea al host para que los clientes
    # se conecten desde fuera del contenedor (make clientes / make cliente)
    ports:
      - "4444:4444"

    restart: "no"